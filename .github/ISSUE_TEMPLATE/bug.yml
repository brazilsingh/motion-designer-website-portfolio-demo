name: Bug report
description: Something looks broken or doesn't work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Open the site on…
        2. Scroll to…
        3. See…
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link to the page (if it's online)
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 131 on Windows 11, Safari on iPhone 15…
    validations:
      required: true
